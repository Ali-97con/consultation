<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<title>علي حامد للإستشارات — تسجيل الدخول</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Tajawal:wght@400;500;700;800&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
  :root{
    --bg-0: #02060f;
    --bg-1: #061227;
    --bg-2: #0d2347;
    --bg-3: #1a3a6b;
    --gold: #d9b87a;
    --gold-2: #f4dca4;
    --gold-deep: #a8854a;
    --ink: #eaf2ff;
    --ink-dim: #8aa0c4;
    --pur-bg-0:#04211a;
    --pur-bg-1:#0a3528;
    --pur-bg-2:#0e4434;
    --pur-light:#e6d8b4;
    --pur-mid:#3aa292;
    --pur-deep:#1f6b56;
    --pur-glow:#5fbfae;
    --pur-beige:#ddc999;
    --pur-beige-deep:#b9a26b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;width:100%;background:#02060f;color:var(--ink);overflow:hidden;font-family:'Tajawal','Cairo',sans-serif}
  #root{width:100%;height:100%}

  .stage{
    position:fixed; inset:0;
    background:
      radial-gradient(1200px 800px at 50% 40%, #143063 0%, #08183a 38%, #030915 75%, #010410 100%);
    overflow:hidden;
    isolation:isolate;
  }
  .stage::before{
    content:""; position:absolute; inset:-20%;
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(217,184,122,.35), transparent 50%),
      radial-gradient(1.5px 1.5px at 80% 20%, rgba(255,255,255,.25), transparent 50%),
      radial-gradient(2px 2px at 65% 75%, rgba(217,184,122,.25), transparent 50%),
      radial-gradient(1px 1px at 30% 85%, rgba(255,255,255,.2), transparent 50%),
      radial-gradient(1.5px 1.5px at 90% 60%, rgba(217,184,122,.2), transparent 50%),
      radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,.18), transparent 50%);
    background-repeat:repeat;
    background-size: 600px 600px, 500px 500px, 700px 700px, 550px 550px, 480px 480px, 620px 620px;
    animation: drift 60s linear infinite;
    opacity:.6;
    pointer-events:none;
  }
  @keyframes drift{
    to{ transform: translate3d(-60px, -40px, 0); }
  }
  .stage::after{
    content:""; position:absolute; inset:0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
  }

  .corner{
    position:absolute; width:160px; height:160px;
    border:1px solid rgba(217,184,122,.28);
    pointer-events:none;
    opacity:0; transform:scale(.85);
    animation: cornerIn 1.4s cubic-bezier(.16,1,.3,1) forwards;
  }
  .corner.tl{ top:48px; left:48px; border-right:none; border-bottom:none; animation-delay:.1s }
  .corner.tr{ top:48px; right:48px; border-left:none; border-bottom:none; animation-delay:.15s }
  .corner.bl{ bottom:48px; left:48px; border-right:none; border-top:none; animation-delay:.2s }
  .corner.br{ bottom:48px; right:48px; border-left:none; border-top:none; animation-delay:.25s }
  .corner::before{
    content:""; position:absolute; width:8px; height:8px; background:var(--gold);
    border-radius:50%; box-shadow:0 0 12px var(--gold);
  }
  .corner.tl::before{ top:-4px; left:-4px }
  .corner.tr::before{ top:-4px; right:-4px }
  .corner.bl::before{ bottom:-4px; left:-4px }
  .corner.br::before{ bottom:-4px; right:-4px }
  @keyframes cornerIn{ to{ opacity:1; transform:scale(1) } }

  .topbar{
    position:absolute; top:40px; left:0; right:0; display:flex; justify-content:center;
    font-family:'Cormorant Garamond', serif;
    font-size:13px; letter-spacing:.5em; color:rgba(217,184,122,.7); text-transform:uppercase;
    opacity:0; animation: fadeUp 1.2s ease forwards .3s;
  }
  .botbar{
    position:absolute; bottom:30px; left:0; right:0; display:flex; justify-content:center; gap:36px;
    color:rgba(180,200,230,.45); font-size:10px; letter-spacing:.35em; text-transform:uppercase;
    opacity:0; animation: fadeUp 1.2s ease forwards 3.8s;
  }
  .botbar span{ display:flex; align-items:center; gap:10px }
  .botbar i{ display:inline-block; width:5px; height:5px; background:var(--gold); border-radius:50%; box-shadow:0 0 8px var(--gold); font-style:normal }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }

  .logo-stage{
    position:absolute; left:50%; top:38%;
    width:300px; height:300px;
    transform:translate(-50%,-50%);
  }
  .logo-ring{
    position:absolute; inset:-30px;
    border-radius:50%;
    border:1px solid rgba(217,184,122,.22);
    opacity:0;
    animation: ringIn 1.6s cubic-bezier(.16,1,.3,1) forwards 1.6s;
  }
  .logo-ring.r2{ inset:-60px; border-color:rgba(217,184,122,.12); animation-delay:1.8s }
  @keyframes ringIn{
    from{ opacity:0; transform:scale(.7) rotate(-20deg)}
    to{ opacity:1; transform:scale(1) rotate(0)}
  }
  .logo-glow{
    position:absolute; inset:-40px; border-radius:50%;
    background: radial-gradient(circle, rgba(217,184,122,.35) 0%, rgba(217,184,122,.1) 35%, transparent 65%);
    opacity:0; filter:blur(20px);
    animation: glowPulse 3s ease-in-out infinite 2s;
  }
  @keyframes glowPulse{
    0%,100%{ opacity:.4; transform:scale(.95)}
    50%{ opacity:.8; transform:scale(1.05)}
  }

  .textblock{
    position:absolute; left:50%; top:62%;
    transform:translate(-50%,0);
    text-align:center;
    width:min(900px, 92vw);
  }
  .ornament{
    display:flex; align-items:center; justify-content:center; gap:18px;
    color:rgba(217,184,122,.85);
    opacity:0;
    animation: fadeUp 1s ease forwards 2.4s;
  }
  .ornament .line{ height:1px; width:60px; background:linear-gradient(to right, transparent, rgba(217,184,122,.6), transparent) }
  .ornament .diamond{
    width:8px; height:8px; background:var(--gold); transform:rotate(45deg);
    box-shadow:0 0 10px var(--gold);
  }
  .welcome{
    font-family:'Cairo', sans-serif;
    font-weight:300;
    font-size:clamp(14px, 1.3vw, 18px);
    letter-spacing:.5em;
    color:rgba(180,200,230,.7);
    margin:18px 0 12px;
    opacity:0;
    animation: fadeUp 1s ease forwards 2.55s;
  }
  .title{
    font-family:'Cairo', sans-serif;
    font-weight:900;
    font-size:clamp(28px, 3.2vw, 46px);
    letter-spacing:.02em;
    background: linear-gradient(180deg, #fff 0%, #e6c98a 65%, #c39a52 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1.2;
    opacity:0;
    animation: titleIn 1.2s cubic-bezier(.16,1,.3,1) forwards 2.7s;
  }
  @keyframes titleIn{
    from{ opacity:0; transform:translateY(14px); letter-spacing:.2em }
    to{ opacity:1; transform:translateY(0); letter-spacing:.02em }
  }

  .stage.exiting{ animation: exitStage 1s cubic-bezier(.65,0,.35,1) forwards }
  @keyframes exitStage{
    0%   { opacity:1; transform:scale(1); filter:blur(0) }
    100% { opacity:0; transform:scale(1.08); filter:blur(10px) }
  }

  /* ============= TITLE REVEAL (RTL cursor sweep) ============= */
  .stage.v-donutcine .title{
    animation: none !important;
    opacity: 1 !important;
    letter-spacing: .02em;
    background: none;
    color: transparent;
    line-height: 1.6;
    padding: 0.1em 0 0.25em;
  }
  .stage.v-donutcine .title .title-wrap{
    display: inline-block;
    position: relative;
    padding: 0.1em 0.15em 0.3em 0.15em;
    background: linear-gradient(180deg, #fff 0%, #e6d8b4 55%, #3aa292 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    clip-path: inset(-20% 0 -20% 100%);
    -webkit-clip-path: inset(-20% 0 -20% 100%);
    animation: titleReveal 1.6s cubic-bezier(.22,1,.36,1) forwards 3.6s;
  }
  @keyframes titleReveal{
    0%   { opacity: 0; clip-path: inset(-20% 0 -20% 100%); -webkit-clip-path: inset(-20% 0 -20% 100%); transform: translateY(8px); }
    15%  { opacity: 1; }
    100% { opacity: 1; clip-path: inset(-20% 0 -20% 0); -webkit-clip-path: inset(-20% 0 -20% 0); transform: translateY(0); }
  }
  .stage.v-donutcine .title .title-wrap::after{
    content: "";
    position: absolute;
    top: 18%;
    right: 0;
    width: 3px;
    height: 64%;
    background: var(--pur-glow);
    box-shadow: 0 0 14px var(--pur-glow), 0 0 28px rgba(95,191,174,.5);
    border-radius: 2px;
    opacity: 0;
    pointer-events: none;
    animation: cursorSweep 1.6s cubic-bezier(.22,1,.36,1) forwards 3.6s;
  }
  @keyframes cursorSweep{
    0%   { right: 0;     opacity: 0; }
    12%  { opacity: 1; }
    88%  { right: 100%;  opacity: 1; }
    100% { right: 102%;  opacity: 0; }
  }

  /* ============= TAGLINE ============= */
  .tagline{
    margin-top: 16px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(13px, 1.05vw, 16px);
    color: rgba(230, 216, 180, .55);
    letter-spacing: .14em;
    opacity: 0;
    animation: fadeUp 1.4s ease forwards 5.4s;
  }
  .tagline .dot{
    display: inline-block;
    margin: 0 14px;
    color: var(--pur-glow);
    font-size: 8px;
    vertical-align: middle;
    transform: rotate(45deg);
    text-shadow: 0 0 8px var(--pur-glow);
  }

  /* ============= LOGIN SUCCESS STATE ============= */
  .login-submit.ok{
    background: linear-gradient(135deg, #4ade80 0%, #16a34a 55%, #15803d 100%);
    box-shadow:
      0 14px 38px rgba(22,163,74,.55),
      0 0 0 1px rgba(255,255,255,.14) inset,
      0 0 0 0 rgba(74,222,128,.0);
    filter: brightness(1.05);
    animation: okPulse .9s cubic-bezier(.22,1,.36,1);
  }
  .login-submit.ok::before{ display: none }
  @keyframes okPulse{
    0%   { transform: scale(1) }
    35%  { transform: scale(1.03); box-shadow: 0 18px 50px rgba(22,163,74,.7), 0 0 0 12px rgba(74,222,128,.0) }
    100% { transform: scale(1) }
  }
  .login-check-svg{
    width: 24px;
    height: 24px;
  }
  .login-check-svg polyline{
    fill: none;
    stroke: #fff;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 24;
    stroke-dashoffset: 24;
    animation: drawCheck .45s cubic-bezier(.22,1,.36,1) forwards .08s;
  }
  @keyframes drawCheck{ to { stroke-dashoffset: 0 } }

  /* ============= INPUT BREATHING ON IDLE ============= */
  .login-card:not(:focus-within) .login-input-wrap{
    animation: inputBreath 5s ease-in-out infinite;
  }
  @keyframes inputBreath{
    0%,100% { border-color: rgba(95,191,174,.20) }
    50%     { border-color: rgba(95,191,174,.35) }
  }

  .stage.v-donutcine{
    background:
      radial-gradient(1400px 900px at 30% 50%, #166b54 0%, #0d4a39 32%, #04211a 72%, #021510 100%);
  }
  .stage.v-donutcine::before{
    background:
      radial-gradient(2px 2px at 15% 25%, rgba(95,191,174,.5), transparent 50%),
      radial-gradient(1.5px 1.5px at 78% 22%, rgba(255,255,255,.32), transparent 50%),
      radial-gradient(2px 2px at 62% 72%, rgba(168,124,255,.38), transparent 50%),
      radial-gradient(1.5px 1.5px at 28% 82%, rgba(255,255,255,.26), transparent 50%),
      radial-gradient(1.5px 1.5px at 92% 58%, rgba(95,191,174,.4), transparent 50%),
      radial-gradient(1px 1px at 8% 62%, rgba(255,255,255,.25), transparent 50%);
    background-size: 600px 600px, 500px 500px, 700px 700px, 550px 550px, 480px 480px, 620px 620px;
    animation: drift 80s linear infinite, dustPulse 6s ease-in-out infinite;
    opacity:.85;
  }
  .stage.v-donutcine::after{
    background: radial-gradient(ellipse at 30% 50%, transparent 30%, rgba(2,15,10,.75) 100%);
  }
  @keyframes dustPulse{
    0%,100%{ filter: brightness(.9) }
    50%{ filter: brightness(1.4) }
  }

  .stage.v-donutcine .corner,
  .stage.v-donutcine .logo-ring,
  .stage.v-donutcine .logo-glow{ display:none }
  .stage.v-donutcine .topbar{ color:rgba(230,216,180,.55) }

  .beams{
    position:absolute; inset:0; pointer-events:none; overflow:hidden;
    opacity:0;
  }
  .stage.v-donutcine .beams{ animation: fadeUp 2s ease forwards .5s; opacity:.55 }
  .beam{
    position:absolute; top:-20%; width:2px; height:140%;
    filter: blur(1.5px);
    transform-origin: top center;
    background: linear-gradient(to bottom, transparent, rgba(58,162,146,.5), transparent);
  }
  .beam.b1{ left:18%; transform: rotate(8deg); animation: beamPulse 5s ease-in-out infinite }
  .beam.b2{ left:42%; transform: rotate(-4deg); animation: beamPulse 6s ease-in-out infinite .6s }
  .beam.b3{ left:68%; transform: rotate(6deg); animation: beamPulse 7s ease-in-out infinite 1.1s }
  .beam.b4{ left:85%; transform: rotate(-10deg); animation: beamPulse 5.5s ease-in-out infinite 1.6s }
  @keyframes beamPulse{
    0%,100%{ opacity:.25 }
    50%{ opacity:.7 }
  }

  .stage.v-donutcine .logo-stage{
    left:30%; top:48%;
    width:420px; height:420px;
  }

  .donut-svg{
    position:absolute; inset:0;
    width:100%; height:100%;
    overflow:visible;
    filter: drop-shadow(0 30px 60px rgba(31,107,86,.5))
            drop-shadow(0 0 40px rgba(58,162,146,.4));
  }
  .donut-svg .wedge{
    transform-box: fill-box;
    transform-origin: var(--ox, 0px) var(--oy, 0px);
    opacity:0;
    animation: donutWedgeIn 2.4s cubic-bezier(.22,1,.36,1) forwards var(--d, 0s),
               donutBreathe 5s ease-in-out infinite calc(var(--d, 0s) + 2.6s);
  }
  @keyframes donutWedgeIn{
    from{ opacity:0; transform: translate(var(--tx,0px), var(--ty,0px)) scale(.6) rotate(var(--rot,0deg)); }
    to  { opacity:1; transform: translate(0,0) scale(1) rotate(0deg); }
  }
  @keyframes donutBreathe{
    0%,100%{ transform: translate(0,0) scale(1) }
    50%   { transform: translate(var(--bx,0px), var(--by,0px)) scale(1.015) }
  }

  .donut-logo{
    position:absolute;
    left:50%; top:50%;
    width:42%; height:42%;
    border-radius:50%;
    background-image: url('assets/logo.jpg');
    background-size: cover;
    background-position: center;
    box-shadow:
      0 0 0 3px rgba(230,216,180,.5),
      0 0 0 9px rgba(95,191,174,.22),
      0 22px 60px rgba(2,15,10,.7),
      0 0 60px rgba(58,162,146,.55);
    opacity:0;
    z-index:4;
    transform: translate(-50%,-50%) scale(.35);
    animation: donutLogoIn 1.5s cubic-bezier(.34,1.45,.5,1) forwards 3.2s,
               donutLogoFloat 6s ease-in-out infinite 4.8s;
  }
  @keyframes donutLogoIn{
    0%   { opacity:0; transform: translate(-50%,-50%) scale(.35);  filter: blur(22px) brightness(.7); }
    35%  { opacity:1; transform: translate(-50%,-50%) scale(.92);  filter: blur(3px)  brightness(1.05); }
    65%  { opacity:1; transform: translate(-50%,-50%) scale(1.22); filter: blur(0)    brightness(1.20); }
    85%  { transform: translate(-50%,-50%) scale(1.06); }
    100% { opacity:1; transform: translate(-50%,-50%) scale(1.10); filter: blur(0)    brightness(1.05); }
  }
  @keyframes donutLogoFloat{
    0%,100%{ transform: translate(-50%,-50%) scale(1.10); filter: brightness(1.05); }
    50%    { transform: translate(-50%,-51.2%) scale(1.12); filter: brightness(1.13); }
  }
  /* Outer ring pulse */
  .donut-logo::after{
    content:"";
    position:absolute;
    inset:-12px;
    border-radius:50%;
    border:1.5px solid rgba(95,191,174,.5);
    animation: logoRingPulse 2.8s ease-in-out infinite 4.7s;
    pointer-events:none;
  }
  @keyframes logoRingPulse{
    0%,100%{ transform:scale(1);    opacity:.55; border-color:rgba(95,191,174,.5) }
    50%    { transform:scale(1.28); opacity:.08; border-color:rgba(95,191,174,.15) }
  }
  /* Burst halo on logo arrival — expands & fades once */
  .donut-logo::before{
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(95,191,174,.55) 0%, rgba(95,191,174,.18) 45%, rgba(95,191,174,0) 70%);
    opacity:0;
    z-index:-1;
    pointer-events:none;
    animation: logoBurst 1.6s cubic-bezier(.16,1,.3,1) forwards 3.55s;
  }
  @keyframes logoBurst{
    0%   { transform: scale(.95); opacity: 0; }
    15%  { opacity: .95; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  .donut-center{
    position:absolute;
    left:50%; top:50%;
    width:42%; height:42%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle, rgba(95,191,174,.4) 0%, rgba(31,107,86,.14) 50%, transparent 75%);
    opacity:0;
    animation: fadeUp 2.2s ease forwards 2.8s;
    pointer-events:none;
  }

  .deco-chart{
    position:absolute;
    right:2%; bottom:3%;
    width:380px; height:200px;
    opacity:0;
    animation: chartIn 1.4s cubic-bezier(.16,1,.3,1) forwards 3.4s;
    pointer-events:none;
  }
  @keyframes chartIn{
    from{ opacity:0; transform: translateY(20px); }
    to  { opacity:.85; transform: translateY(0); }
  }
  .deco-chart svg{ width:100%; height:100%; overflow:visible }
  .deco-chart .area-path{
    fill: url(#chartGrad);
    stroke: rgba(230,216,180,.72);
    stroke-width: 1.2;
    stroke-dasharray: 800;
    stroke-dashoffset: 800;
    animation: drawLine 3s ease forwards 3.6s;
    filter: drop-shadow(0 0 8px rgba(58,162,146,.55));
  }
  @keyframes drawLine{ to { stroke-dashoffset: 0 } }
  .deco-chart .dot{
    fill: #fff;
    opacity:0;
    animation: dotPop .4s ease forwards;
  }
  @keyframes dotPop{ to{ opacity:1; transform: scale(1) } }

  .stage.v-donutcine .textblock{
    left:65%; top:14%;
    transform: translate(-50%,0);
    text-align:center;
  }
  .stage.v-donutcine .title{
    background: linear-gradient(180deg, #fff 0%, #e6d8b4 55%, #3aa292 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .stage.v-donutcine .welcome{ color: rgba(230,216,180,.72) }
  .stage.v-donutcine .ornament .diamond{ background: var(--pur-glow); box-shadow:0 0 10px var(--pur-glow) }
  .stage.v-donutcine .ornament .line{ background: linear-gradient(to right, transparent, rgba(230,216,180,.55), transparent) }
  .stage.v-donutcine .textblock .ornament{ animation-delay: 3.2s }
  .stage.v-donutcine .textblock .welcome{ animation-delay: 3.4s }
  .stage.v-donutcine .textblock .title{ animation-delay: 3.6s }

  /* ============= LOGIN CARD ============= */
  .login-card{
    position:absolute;
    left:65%; top:32%;
    transform: translate(-50%, 0);
    width:min(440px, 38vw);
    padding:32px 32px 26px;
    border-radius:20px;
    background:
      linear-gradient(165deg, rgba(14,68,52,.62) 0%, rgba(8,42,32,.7) 100%);
    border:1px solid rgba(95,191,174,.25);
    box-shadow:
      0 30px 80px rgba(2,15,10,.6),
      0 0 0 1px rgba(255,255,255,.04) inset,
      0 1px 0 rgba(255,255,255,.08) inset;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    opacity:0;
    z-index:6;
    animation: loginIn 1.4s cubic-bezier(.16,1,.3,1) forwards 4s;
    overflow:hidden;
  }
  @keyframes loginIn{
    0%   { opacity:0; transform: translate(-50%, 30px) scale(.96); filter: blur(14px); }
    60%  { opacity:1; filter: blur(0); }
    100% { opacity:1; transform: translate(-50%, 0) scale(1); filter: blur(0); }
  }
  .login-card::before{
    content:"";
    position:absolute;
    top:0; left:-30%;
    width:60%; height:100%;
    background: linear-gradient(115deg,
      transparent 0%,
      rgba(200,160,255,.0) 38%,
      rgba(245,237,210,.4) 50%,
      rgba(200,160,255,.0) 62%,
      transparent 100%);
    transform: skewX(-18deg);
    pointer-events:none;
    opacity:0;
    z-index:1;
    mix-blend-mode: screen;
    animation: loginSheen 1.6s cubic-bezier(.5,0,.2,1) forwards 4.8s;
  }
  @keyframes loginSheen{
    0%   { opacity:0; transform: translateX(0) skewX(-18deg) }
    25%  { opacity:1 }
    100% { opacity:0; transform: translateX(280%) skewX(-18deg) }
  }
  .login-card::after{
    content:"";
    position:absolute;
    top:10px; left:10px; right:10px; bottom:10px;
    border-radius:14px;
    pointer-events:none;
    background:
      linear-gradient(135deg, rgba(230,216,180,.55), transparent 18%) top left/22px 22px no-repeat,
      linear-gradient(225deg, rgba(230,216,180,.55), transparent 18%) top right/22px 22px no-repeat,
      linear-gradient(45deg,  rgba(230,216,180,.55), transparent 18%) bottom left/22px 22px no-repeat,
      linear-gradient(315deg, rgba(230,216,180,.55), transparent 18%) bottom right/22px 22px no-repeat;
    opacity:0;
    z-index:2;
    animation: cornerAccents 1s ease forwards 5.2s;
  }
  @keyframes cornerAccents{ to{ opacity:.7 } }

  .login-card > .login-head,
  .login-card > .login-field,
  .login-card > .login-row,
  .login-card > .login-submit,
  .login-card > .login-error,
  .login-card > .login-foot{
    opacity:0;
    transform: translateY(14px);
    filter: blur(6px);
    animation: childIn .7s cubic-bezier(.16,1,.3,1) forwards;
    position:relative;
    z-index:2;
  }
  @keyframes childIn{
    to{ opacity:1; transform: translateY(0); filter: blur(0); }
  }
  .login-card > .login-head    { animation-delay: 4.6s }
  .login-card > .login-field:nth-of-type(2) { animation-delay: 4.8s }
  .login-card > .login-field:nth-of-type(3) { animation-delay: 4.95s }
  .login-card > .login-row     { animation-delay: 5.1s }
  .login-card > .login-submit  { animation-delay: 5.25s }
  .login-card > .login-foot    { animation-delay: 5.4s }

  .login-head .login-line{
    transform: scaleX(0);
    transform-origin: center;
    animation: lineGrow .9s cubic-bezier(.16,1,.3,1) forwards;
  }
  .login-head .login-line:first-child{ transform-origin: right center; animation-delay: 4.8s }
  .login-head .login-line:last-child { transform-origin: left  center; animation-delay: 4.8s }
  @keyframes lineGrow{ to{ transform: scaleX(1) } }
  .login-glow{
    position:absolute; inset:-30%;
    background: radial-gradient(closest-side, rgba(58,162,146,.2), transparent 70%);
    pointer-events:none;
    animation: glowPulse 4s ease-in-out infinite;
  }
  .login-head{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin-bottom:22px;
    position:relative;
  }
  .login-head .login-line{
    height:1px; flex:1;
    background: linear-gradient(to right, transparent, rgba(230,216,180,.45), transparent);
  }
  .login-title{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:14px;
    color: rgba(245,237,210,.92);
    letter-spacing:.2em;
    white-space:nowrap;
  }
  .login-field{
    display:block;
    margin-bottom:16px;
    position:relative;
  }
  .login-label{
    display:block;
    font-family:'Cairo', sans-serif;
    font-size:11px;
    color: rgba(230,216,180,.65);
    letter-spacing:.18em;
    margin-bottom:8px;
    padding-right:4px;
  }
  .login-input-wrap{
    position:relative;
    display:flex; align-items:center;
    background: rgba(6,32,24,.5);
    border:1px solid rgba(95,191,174,.20);
    border-radius:10px;
    padding:0 14px;
    height:46px;
    transition: border-color .25s ease, box-shadow .25s ease, background .25s ease, transform .25s ease;
    overflow:hidden;
  }
  .login-input-wrap::after{
    content:"";
    position:absolute;
    bottom:0; left:50%;
    width:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--pur-glow), transparent);
    transform: translateX(-50%);
    transition: width .35s ease;
    pointer-events:none;
  }
  .login-input-wrap:focus-within::after{ width:90% }
  .login-input-wrap:focus-within{
    border-color: rgba(168,124,255,.6);
    background: rgba(8,42,32,.7);
    box-shadow: 0 0 0 3px rgba(58,162,146,.14), 0 8px 28px rgba(31,107,86,.32);
    transform: translateY(-1px);
  }
  .login-ico{
    color: rgba(230,216,180,.55);
    flex:none;
  }
  .login-input-wrap:focus-within .login-ico{ color: var(--pur-glow) }
  .login-input{
    flex:1; min-width:0;
    background:transparent; border:0; outline:0;
    color: #fff;
    font-family:'Cairo', sans-serif;
    font-size:14px;
    padding:0 12px;
    height:100%;
    letter-spacing:.05em;
  }
  .login-input::placeholder{ color: rgba(95,191,174,.4); font-style:italic; font-weight:400 }
  .login-eye{
    background:transparent; border:0; cursor:pointer; padding:4px;
    color: rgba(230,216,180,.55);
    display:flex; align-items:center; justify-content:center;
    border-radius:6px;
    transition: color .2s, background .2s;
  }
  .login-eye:hover{ color: var(--pur-light); background: rgba(58,162,146,.14) }

  .login-row{
    display:flex; align-items:center; justify-content:space-between;
    margin: 4px 2px 18px;
    font-family:'Cairo', sans-serif;
    font-size:12px;
  }
  .login-check{
    display:flex; align-items:center; gap:8px;
    color: rgba(245,237,210,.78);
    cursor:pointer;
    user-select:none;
  }
  .login-check input{ display:none }
  .login-check-box{
    width:16px; height:16px; border-radius:5px;
    border:1.5px solid rgba(230,216,180,.45);
    background: rgba(6,32,24,.45);
    display:inline-flex; align-items:center; justify-content:center;
    transition: background .2s, border-color .2s;
    position:relative;
  }
  .login-check input:checked + .login-check-box{
    background: var(--pur-mid);
    border-color: var(--pur-light);
  }
  .login-check input:checked + .login-check-box::after{
    content:""; width:8px; height:5px;
    border-left:2px solid #fff; border-bottom:2px solid #fff;
    transform: rotate(-45deg) translate(1px,-1px);
  }
  .login-forgot{
    color: rgba(230,216,180,.78);
    text-decoration:none;
    transition: color .2s;
  }
  .login-forgot:hover{ color: var(--pur-light); text-decoration:underline }

  .login-submit{
    width:100%;
    height:48px;
    border:0;
    border-radius:10px;
    background: linear-gradient(135deg, #5fbfae 0%, #3aa292 55%, #1f6b56 100%);
    color: #fff;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:.2em;
    cursor:pointer;
    position:relative;
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow: 0 10px 30px rgba(31,107,86,.5), 0 0 0 1px rgba(255,255,255,.08) inset;
    transition: transform .15s, box-shadow .2s, filter .2s;
    overflow:hidden;
    isolation:isolate;
  }
  .login-submit::before{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(115deg,
      transparent 30%,
      rgba(255,255,255,.18) 50%,
      transparent 70%);
    transform: translateX(-100%);
    animation: btnSheen 3.6s ease-in-out infinite 6s;
    pointer-events:none;
    z-index:1;
  }
  .login-submit > *{ position:relative; z-index:2 }
  @keyframes btnSheen{
    0%   { transform: translateX(-100%) }
    40%  { transform: translateX(120%) }
    100% { transform: translateX(120%) }
  }
  .login-submit:hover{
    transform: translateY(-1px);
    box-shadow: 0 14px 36px rgba(31,107,86,.6), 0 0 0 1px rgba(255,255,255,.12) inset;
    filter: brightness(1.08);
  }
  .login-submit:active{ transform: translateY(0); filter: brightness(.95) }
  .login-submit.busy{ cursor:wait; filter: brightness(.85) }
  .login-spinner{
    width:18px; height:18px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;
    border-radius:50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg) } }

  .login-error{
    margin: 0 0 14px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(180, 50, 50, 0.18);
    border: 1px solid rgba(220, 90, 90, 0.45);
    color: #ffd9d9;
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    letter-spacing: .05em;
    text-align: center;
    animation: errShake .45s cubic-bezier(.36,.07,.19,.97);
  }
  @keyframes errShake{
    10%, 90% { transform: translateX(-1px) }
    20%, 80% { transform: translateX(2px) }
    30%, 50%, 70% { transform: translateX(-4px) }
    40%, 60% { transform: translateX(4px) }
  }

  .login-foot{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:18px;
    font-family:'Cairo', sans-serif;
    font-size:10px;
    color: rgba(95,191,174,.5);
    letter-spacing:.2em;
  }
  .login-dot{
    width:4px; height:4px; background: var(--pur-glow);
    border-radius:50%; box-shadow: 0 0 6px var(--pur-glow);
    animation: dotPulse 2.4s ease-in-out infinite;
  }
  .login-dot:nth-child(3){ animation-delay: 1.2s }
  @keyframes dotPulse{
    0%,100%{ transform: scale(1); opacity:.7 }
    50%   { transform: scale(1.6); opacity:1 }
  }

  .audio-prompt{
    position:absolute; bottom:70px; right:24px;
    color:rgba(180,200,230,.45); font-size:10px; letter-spacing:.25em;
    font-family:'Cairo',sans-serif; text-transform:uppercase;
    pointer-events:none; opacity:0;
    animation: fadeUp 1s ease forwards 3.6s;
  }

  /* ============= AUDIO-LOCKED STATE — pause all animations for perfect A/V sync ============= */
  .stage.audio-pending,
  .stage.audio-pending *,
  .stage.audio-pending::before,
  .stage.audio-pending::after,
  .stage.audio-pending *::before,
  .stage.audio-pending *::after{
    animation-play-state: paused !important;
  }
  .stage.audio-pending{
    filter: brightness(.85) saturate(.8);
    transition: filter .4s ease;
  }
  .stage:not(.audio-pending){
    filter: brightness(1) saturate(1);
    transition: filter .6s ease;
  }
  .start-hint{
    position: absolute;
    left: 50%;
    bottom: 9%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .32em;
    color: rgba(230,216,180,.75);
    text-align: center;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
    animation: hintPulse 2s ease-in-out infinite !important;
    animation-play-state: running !important;
  }
  .start-hint .pulse-dot{
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--pur-glow);
    box-shadow: 0 0 14px var(--pur-glow), 0 0 28px rgba(95,191,174,.4);
    animation: hintDot 1.2s ease-in-out infinite !important;
    animation-play-state: running !important;
  }
  @keyframes hintPulse{
    0%,100%{ opacity: .65 }
    50%   { opacity: 1 }
  }
  @keyframes hintDot{
    0%,100%{ transform: scale(1);   opacity: .9 }
    50%    { transform: scale(1.4); opacity: 1 }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="splash.jsx"></script>
</body>
</html>
